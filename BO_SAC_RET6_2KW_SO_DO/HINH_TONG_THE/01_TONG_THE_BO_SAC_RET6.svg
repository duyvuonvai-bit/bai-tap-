   <g id="text_1">
    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #18344d" x="26.38125" y="46.324725" transform="rotate(-0 26.38125 46.324725)">01 — Toàn bộ hệ thống dùng bo STM32G474RET6 tự thiết kế</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #637381" x="26.38125" y="76.192042" transform="rotate(-0 26.38125 76.192042)">Thông số mục tiêu: 220 VAC → bus 400 VDC → 58 V / 34,48 A; pin LiFePO₄ 16S. Vị trí các khối là sơ đồ kết nối, không phải bố trí PCB.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #9e4d00" x="26.38125" y="638.55072" transform="rotate(-0 26.38125 638.55072)">THIẾT KẾ NGUYÊN LÝ ĐỂ RÀ SOÁT / THỬ THẤP ÁP — chưa có PCB công suất, Gerber hoặc xác nhận chạy 400 V/2 kW.</text>
   </g>
