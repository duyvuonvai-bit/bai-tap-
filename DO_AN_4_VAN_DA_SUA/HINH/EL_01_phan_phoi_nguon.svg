   <g id="text_1">
    <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #123247" x="33.84" y="51.580013" transform="rotate(-0 33.84 51.580013)">EL-01 | NGUYÊN LÝ PHÂN PHỐI NGUỒN</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #61727e" x="33.84" y="69.933919" transform="rotate(-0 33.84 69.933919)">Sơ đồ khối nguồn. Điện áp, số pha, định mức bảo vệ và terminal chốt theo thiết bị lắp thật.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #123247" transform="translate(53.109375 254.530875)">LƯỚI ĐIỆN</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #123247" transform="translate(59.245312 270.703688)">L/N hoặc</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #123247" transform="translate(59.930625 286.8765)">L1/L2/L3</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #123247" transform="translate(198.617734 254.215406)">QF0</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #123247" transform="translate(185.757188 269.700484)">Cách ly /</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #123247" transform="translate(174.238125 284.943219)">bảo vệ chính</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #123247" x="354.69" y="145.11525" transform="rotate(-0 354.69 145.11525)">QF-PLC</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #123247" transform="translate(517.948906 136.722945)">CPU 1214C AC/DC/Relay</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #123247" transform="translate(467.637656 152.95568)">Nguồn CPU AC; không cấp 24 VDC vào L/N</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #123247" x="354.69" y="269.85525" transform="rotate(-0 354.69 269.85525)">QF-PS</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #123247" transform="translate(509.082734 261.803688)">PS1: 24 VDC / 5 A (đề xuất)</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #123247" transform="translate(474.689687 277.456344)">HMI, DI, rơle và coil van; tải phải tính lại</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #123247" x="354.69" y="394.59525" transform="rotate(-0 354.69 394.59525)">QF-M</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #123247" transform="translate(494.479375 386.98068)">KM1 → OL1 → ĐỘNG CƠ BƠM P1</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #123247" transform="translate(462.056016 403.213414)">Nguồn 1/3 pha và bảo vệ theo nhãn động cơ</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087f5b" x="39.42" y="426.2112" transform="rotate(-0 39.42 426.2112)">PE: nối trực tiếp vỏ tủ / vỏ bơm / phần kim loại cần bảo vệ; không đi qua KM1 hay OL1.</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #61727e" x="33.84" y="467.374713" transform="rotate(-0 33.84 467.374713)">Mạch điều khiển KM1 xem EL-02; mạch coil van xem EL-04. Đây là bản nguyên lý, chưa phải hồ sơ thi công.</text>
   </g>
