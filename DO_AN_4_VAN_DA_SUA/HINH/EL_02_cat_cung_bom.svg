   <g id="text_17">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #61727e" transform="translate(33.84 481.446481)">Phản hồi PLC dùng tiếp điểm phụ tách khỏi chuỗi coil; phải bổ sung khối tiếp điểm nếu thiết bị chưa đủ cực.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #61727e" transform="translate(33.84 496.203513)">Dập xung coil theo manual. STOP thường không thay thế E-STOP; sơ đồ chưa xác lập cấp SIL/PL.</text>
