   <g id="text_16">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #61727e" transform="translate(33.84 470.12025)">Cấp common rơle đúng nhóm chân theo manual CPU; DO không tự tạo ra điện áp 24 VDC.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #61727e" transform="translate(33.84 485.327281)">DI về 0 khi liên động mất điều kiện; RESET bắt cạnh. I0.6… và các DO còn lại dự phòng.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #61727e" transform="translate(33.84 500.084313)">Đây là ánh xạ chức năng. Số terminal và mã dây phải hoàn thiện trước khi đấu dây.</text>
   </g>
