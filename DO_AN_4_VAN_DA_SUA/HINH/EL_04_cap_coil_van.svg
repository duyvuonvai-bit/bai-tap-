   <g id="text_24">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #61727e" transform="translate(33.84 473.724488)">Mạch lệnh: +24 V điều khiển → common DO → tiếp điểm Q0.1…Q0.4 → coil KA1…KA4 → 0 V.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #61727e" transform="translate(33.84 488.704175)">Dập xung song song từng coil DC: diode/TVS theo manual; diode thường có thể làm tăng thời gian nhả.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #61727e" transform="translate(33.84 503.965113)">KSR cắt nguồn van khi E-STOP; HMI/đèn lỗi dùng nguồn chưa cắt. Chọn cầu chì theo dòng và dây dẫn.</text>
