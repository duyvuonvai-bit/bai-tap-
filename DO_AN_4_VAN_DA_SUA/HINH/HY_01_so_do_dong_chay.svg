   <g id="text_18">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #61727e" transform="translate(33.84 433.202794)">Bơm chạy liên tục trong chu trình AUTO; mỗi van mở/đóng đúng bảng 5 bước. Nước phun được thu hồi về bể.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #61727e" transform="translate(33.84 448.182481)">RV1 không mặc nhiên bảo đảm lưu lượng tối thiểu qua bơm; cần kiểm tra riêng ở bước 1 và khi chuyển bước.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #61727e" transform="translate(33.84 462.939513)">Sơ đồ chưa xác định DN, Kv, áp suất cài đặt, bảo vệ áp lực hoặc thông số thi công.</text>
   </g>
  </g>
 </g>
